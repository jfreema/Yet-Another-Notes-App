name: Shots (temporary)

# Temporary, for this branch only and never for main: draws the note window before and after a change, and commits
# the pictures back to this branch.

on:
  push:
    branches: [claude/project-thread-xy7mnq]
    paths: [Tests/YANATests/ShotTests.swift, .github/workflows/shots.yml]

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: After
        timeout-minutes: 15
        run: |
          mkdir -p shots
          for name in after after-sticky; do
            YANA_SCREENSHOTS=$name YANA_SHOTS_DIR="$PWD/shots" swift test --filter ShotTests 2>&1 | tee -a shots/after.log
          done
          grep SHOT shots/after.log || true

      - name: Before
        timeout-minutes: 15
        run: |
          git checkout origin/main -- Sources/YANA/TodoList.swift Tests/YANATests/TodoListTests.swift
          for name in before before-sticky; do
            YANA_SCREENSHOTS=$name YANA_SHOTS_DIR="$PWD/shots" swift test --filter ShotTests 2>&1 | tee -a shots/before.log
          done
          grep SHOT shots/before.log || true
          git checkout HEAD -- Sources/YANA/TodoList.swift Tests/YANATests/TodoListTests.swift

      - name: Commit the pictures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          grep SHOT shots/*.log > shots/numbers.txt || true
          git add shots
          git commit -m "Shots" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
