name: Preview (temporary)

# TEMPORARY, on this branch only: compiles, tests and draws the note window, then commits the pictures back here.

on:
  push:
    branches: [claude/project-thread-7c1x2i]
    paths-ignore: [preview/**]

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Build
        timeout-minutes: 20
        run: |
          swift --version
          if ! swift build --build-tests > build.log 2>&1; then
            grep -n -B2 -A8 "error" build.log | head -400
            exit 1
          fi
          grep "warning:" build.log | sort -u | head -80 || true

      - name: Test
        timeout-minutes: 15
        run: |
          filter="$(cat .github/preview-filter 2>/dev/null || true)"
          if [[ -n "$filter" ]]; then
            swift test --skip-build --filter "$filter"
          else
            swift test --skip-build
          fi

      - name: Draw
        if: always()
        timeout-minutes: 10
        env:
          YANA_PREVIEW: ${{ github.workspace }}/preview
        run: swift test --skip-build --filter PreviewTests

      - name: Commit the pictures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview || exit 0
          git commit -m "Temporary: pictures of the note" || exit 0
          git push
