name: iPhone screenshots (temporary)

# Temporary, on the thread's branch only: takes simulator screenshots of the sample lists and commits them back to the
# branch, to check how the screens look. Not for main.

on:
  push:
    branches: [claude/project-thread-3dglkw]
    paths: [iOS/**, .github/workflows/iphone-screens.yml]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  screens:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v5
      - name: Build for the simulator
        run: |
          brew install xcodegen
          (cd iOS && xcodegen generate)
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.rsplit(".iOS-", 1)[1].split("-"))
              for device in devices:
                  if device["name"] in ("iPhone 17 Pro", "iPhone 16 Pro") and (best is None or version > best[0]):
                      best = (version, device["udid"])
          print(best[1])
          ')"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcodebuild build -project iOS/YANA.xcodeproj -scheme YANA -destination "id=$udid" \
            -derivedDataPath build -quiet
      - name: Take the screenshots
        timeout-minutes: 10
        run: |
          set -x
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/YANA.app
          mkdir -p screens
          shot() {
            local name="$1"; shift
            xcrun simctl terminate "$UDID" io.github.jfreema.yana.ios 2>/dev/null || true
            xcrun simctl launch "$UDID" io.github.jfreema.yana.ios -YANAScreenshots YES "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "screens/$name.png"
          }
          xcrun simctl ui "$UDID" appearance light
          shot lists
          shot list -YANAOpen 0
          shot sticky -YANAOpen 0 -sticky YES
          xcrun simctl ui "$UDID" appearance dark
          shot list-dark -YANAOpen 1
          shot lists-dark
          ls -la screens
      - name: Commit them to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screens
          git commit -m "iPhone screenshots"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
