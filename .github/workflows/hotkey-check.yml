name: Hot key check (temporary)

# Only for this thread's branch, and never for main: runs the tests with the real key press turned on, then runs YANA
# itself and presses Control-Option-N to see the note show and hide.

on:
  push:
    branches: [claude/project-thread-7c1x2i]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Test, pressing the real keys
        timeout-minutes: 15
        env:
          YANA_PRESS_KEYS: "1"
        run: |
          sw_vers
          swift --version
          swift test

      - name: Run YANA and press Control-Option-N
        timeout-minutes: 8
        run: |
          swift build
          bin="$(swift build --show-bin-path)/YANA"
          windows() {
            osascript -e 'tell application "System Events" to get name of windows of (first process whose name is "YANA")' 2>&1
          }
          count() {
            osascript -e 'tell application "System Events" to count windows of (first process whose name is "YANA")' 2>&1
          }
          front() {
            osascript -e 'tell application "System Events" to get name of first process whose frontmost is true' 2>&1
          }
          press() {
            osascript -e 'tell application "System Events" to key code 45 using {control down, option down}'
          }

          echo "::group::The shortcut on, as it starts"
          "$bin" > yana.log 2>&1 &
          pid=$!
          sleep 5
          at_launch="$(count)"
          echo "At launch: $at_launch windows ($(windows)), in front: $(front)"
          press
          sleep 2
          shown="$(count)"
          echo "After the first press: $shown windows ($(windows)), in front: $(front)"
          press
          sleep 2
          hidden="$(count)"
          echo "After the second press: $hidden windows ($(windows)), in front: $(front)"
          press
          sleep 2
          again="$(count)"
          echo "After the third press: $again windows ($(windows)), in front: $(front)"
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          echo "::endgroup::"

          echo "::group::The shortcut turned off"
          defaults write YANA hotKey -bool false
          "$bin" >> yana.log 2>&1 &
          pid=$!
          sleep 5
          press
          sleep 2
          off="$(count)"
          echo "Turned off, after a press: $off windows ($(windows)), in front: $(front)"
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          defaults delete YANA hotKey
          echo "::endgroup::"

          echo "::group::What YANA logged"
          cat yana.log
          log show --last 3m --predicate 'subsystem == "io.github.jfreema.yana"' --info --style compact | tail -20 || true
          echo "::endgroup::"

          echo "At launch $at_launch, first press $shown, second press $hidden, third press $again, turned off $off"
          test "$at_launch" = 0
          test "$shown" = 1
          test "$hidden" = 0
          test "$again" = 1
          test "$off" = 0
