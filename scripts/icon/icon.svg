<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161C47"/>
      <stop offset="1" stop-color="#070A1C"/>
    </linearGradient>
    <radialGradient id="b1" cx="110" cy="930" r="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12E0B8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#12E0B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="920" cy="110" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B7BFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3B7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="900" cy="900" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A04DFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#A04DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9FFEC"/>
      <stop offset="1" stop-color="#19D9A6"/>
    </linearGradient>
    <linearGradient id="orb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9BE0"/>
      <stop offset="1" stop-color="#9B4DFF"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <rect id="back" x="336" y="176" width="470" height="470" rx="76"/>
    <clipPath id="backClip"><use xlink:href="#back"/></clipPath>
    <path id="pane" d="M308 246 H716 a72 72 0 0 1 72 72 V670 L662 796 H308 a72 72 0 0 1 -72 -72 V318 a72 72 0 0 1 72 -72 Z"/>
    <clipPath id="paneClip"><use xlink:href="#pane"/></clipPath>

    <g id="scene">
      <rect x="-80" y="-80" width="1184" height="1184" fill="url(#base)"/>
      <rect x="-80" y="-80" width="1184" height="1184" fill="url(#b1)"/>
      <rect x="-80" y="-80" width="1184" height="1184" fill="url(#b2)"/>
      <rect x="-80" y="-80" width="1184" height="1184" fill="url(#b3)"/>
      <!-- what's behind the notes -->
      <circle cx="262" cy="330" r="150" fill="url(#orb1)"/>
      <circle cx="800" cy="800" r="118" fill="url(#orb2)"/>
    </g>

    <!-- the scene with the back note in it, which the front note is over -->
    <g id="scene2">
      <use xlink:href="#scene"/>
      <g transform="rotate(9 571 411)">
        <use xlink:href="#back" fill="#02030C" fill-opacity="0.5" filter="url(#drop)" transform="translate(0 22)"/>
        <g clip-path="url(#backClip)">
          <g transform="rotate(-9 571 411)"><use xlink:href="#scene" filter="url(#blur)"/></g>
        </g>
        <use xlink:href="#back" fill="url(#frost)"/>
        <use xlink:href="#back" fill="none" stroke="url(#rim)" stroke-width="6"/>
      </g>
    </g>
  </defs>

  <use xlink:href="#scene2"/>

  <g transform="translate(-26 40) rotate(-7 512 521)">
    <use xlink:href="#pane" fill="#02030C" fill-opacity="0.55" filter="url(#drop)" transform="translate(0 26)"/>
    <g clip-path="url(#paneClip)">
      <g transform="rotate(7 512 521) translate(26 -40)"><use xlink:href="#scene2" filter="url(#blur)"/></g>
    </g>
    <use xlink:href="#pane" fill="url(#frost)"/>
    <use xlink:href="#pane" fill="none" stroke="url(#rim)" stroke-width="6"/>
    <!-- folded corner -->
    <path d="M788 670 L662 796 L672 712 a34 34 0 0 1 30 -30 Z" fill="#FFFFFF" fill-opacity="0.5"/>

    <!-- the list -->
    <circle cx="338" cy="382" r="40" fill="#3DF5C4" filter="url(#glow)" opacity="0.9"/>
    <g filter="url(#ink)">
      <circle cx="338" cy="382" r="38" fill="#4BF7CB"/>
      <g fill="#FFFFFF">
        <rect x="406" y="366" width="286" height="32" rx="16" fill-opacity="0.5"/>
        <rect x="406" y="486" width="286" height="32" rx="16"/>
        <rect x="406" y="606" width="176" height="32" rx="16"/>
      </g>
      <g fill="none" stroke="#FFFFFF" stroke-width="10">
        <circle cx="338" cy="502" r="33"/>
        <circle cx="338" cy="622" r="33"/>
      </g>
    </g>
    <path d="M320 383 L333 397 L358 368" fill="none" stroke="#0B1238" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
