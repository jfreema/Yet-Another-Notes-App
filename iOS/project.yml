# YANA for iPhone. There's no Xcode project in the repo: `xcodegen generate` in this folder makes YANA.xcodeproj from
# this file (brew install xcodegen). The app shares Note.swift and SyncFormat.swift with the Mac app, so both read and
# write the same sync files.
name: YANA
options:
  bundleIdPrefix: io.github.jfreema
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 885XHF7XLL
    CURRENT_PROJECT_VERSION: "1"
targets:
  YANA:
    type: application
    platform: iOS
    sources:
      - path: YANA
      - path: Resources
      - path: ../Sources/YANA/Note.swift
        group: Shared
      - path: ../Sources/YANA/SyncFormat.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jfreema.yana.ios
        PRODUCT_NAME: YANA
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  YANATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YANATests
    dependencies:
      - target: YANA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jfreema.yana.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  YANAUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YANAUITests
    dependencies:
      - target: YANA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jfreema.yana.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: YANA
schemes:
  YANA:
    build:
      targets:
        YANA: all
    test:
      targets:
        - YANATests
        - YANAUITests
